name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: ${{ matrix.os }} · bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
      - name: Build menu bar app
        if: runner.os == 'macOS'
        run: app/build.sh

  windows:
    name: windows · ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/run.ps1
